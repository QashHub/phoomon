<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Happy Birthday, <span id="nm">Beautiful</span>!</h1>
  <p class="sub">I made you three little surprises. Open them in any order.</p>
  <div class="grid">
    <button class="tile t1" data-m="m1"><span class="done">✓</span>
      <svg viewBox="0 0 120 100" aria-hidden="true"><rect x="8" y="22" width="104" height="70" rx="8" fill="#fff"/><path d="M8 28l52 36 52-36" fill="none" stroke="#E58DB2" stroke-width="5" stroke-linejoin="round"/><path d="M60 8c-6-8-18 0-8 8l8 7 8-7c10-8-2-16-8-8z" fill="#E58DB2"/></svg>
      <h2>A letter</h2><p>Open the envelope</p></button>
    <button class="tile t2" data-m="m2"><span class="done">✓</span>
      <svg viewBox="0 0 120 100" aria-hidden="true"><rect x="10" y="16" width="100" height="72" rx="8" fill="#fff"/><rect x="20" y="26" width="38" height="52" fill="#F8C8DC"/><rect x="64" y="26" width="38" height="24" fill="#FFF0A6"/><rect x="64" y="54" width="38" height="24" fill="#1E7C76"/></svg>
      <h2>Our album</h2><p>Flip through the photos</p></button>
    <button class="tile t3" data-m="m3"><span class="done">✓</span>
      <svg viewBox="0 0 120 100" aria-hidden="true"><rect x="22" y="50" width="76" height="40" rx="6" fill="#fff"/><path d="M22 62q9 8 19 0t19 0 19 0 19 0v-6H22z" fill="#F8C8DC"/><rect x="57" y="30" width="6" height="20" fill="#5CC6BC"/><path d="M60 14c-6 7-3 13 0 14 3-1 6-7 0-14z" fill="#E8A21C"/></svg>
      <h2>Make a wish</h2><p>Blow out the candles</p></button>
  </div>
  <div id="final">You opened everything. I love you. ♥</div>
</main>

<div class="modal" id="m1" role="dialog" aria-label="Letter"><div class="panel">
  <button class="x" aria-label="Close">✕</button>
  <h2>For you</h2>
  <div class="env" id="env" tabindex="0" role="button" aria-label="Open the envelope">
    <div class="back"></div>
    <div class="letter" id="letter"></div>
    <div class="front"></div><div class="flap"></div>
  </div>
  <p class="hint" id="envhint">Tap the envelope</p>
  <div class="sheet" id="sheet" aria-live="polite"></div>
  <button class="btn" id="fold">Fold it back</button>
</div></div>

<div class="modal" id="m2" role="dialog" aria-label="Album"><div class="panel">
  <button class="x" aria-label="Close">✕</button>
  <h2>Our album</h2>
  <p class="hint">Tap a frame to add a photo from your device.</p>
  <div class="album" id="album"></div>
  <input type="file" accept="image/*" id="file" hidden>
</div></div>

<div class="modal" id="m3" role="dialog" aria-label="Cake"><div class="panel">
  <button class="x" aria-label="Close">✕</button>
  <h2>Make a wish</h2>
  <svg class="cake" viewBox="0 0 300 240" aria-label="Birthday cake with three candles">
    <ellipse cx="150" cy="226" rx="140" ry="10" fill="#5CC6BC" opacity=".5"/>
    <rect x="30" y="150" width="240" height="72" rx="14" fill="#5CC6BC"/>
    <rect x="50" y="100" width="200" height="58" rx="14" fill="#F8C8DC"/>
    <path d="M50 118q16 14 33 0t33 0 34 0 33 0 34 0v-12H50z" fill="#fff"/>
    <path d="M30 168q16 14 30 0t30 0 30 0 30 0 30 0 30 0 30 0 30 0v-10H30z" fill="#FFF0A6"/>
    <g id="candles"></g>
  </svg>
  <button class="btn" id="blow">Blow them out</button>
  <div id="wish" aria-live="polite"></div>
  <p class="hint">Or tap each flame.</p>
</div></div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
